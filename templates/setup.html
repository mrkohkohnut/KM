{% extends "base.html" %}{% block title %}First-time setup{% endblock %}
{% block body %}
<h1>First-time setup</h1>
<p>Create the first admin. Admins need their PIN to switch into admin mode.</p>
<form method="post" class="stack narrow">
  <label>Admin name <input name="name" required autofocus></label>
  <label>PIN (at least 4 characters) <input name="pin" type="password" minlength="4" required></label>
  <button>Create admin</button>
</form>
{% endblock %}
