{% extends "base.html" %}{% block title %}Who are you?{% endblock %}
{% block body %}
<h1>Who are you?</h1>
<form method="post" class="stack narrow">
  <label>Your name
    <select name="name" required autofocus>
      <option value="">Choose…</option>
      {% for b, group in users|groupby('batch_id') %}
      <optgroup label="{{ 'Batch ' ~ b if b else 'Admins' }}">
        {% for u in group %}<option value="{{ u.name }}" {% if g.user and g.user.name == u.name %}selected{% endif %}>{{ u.name }}</option>{% endfor %}
      </optgroup>
      {% endfor %}
    </select>
  </label>
  <label>PIN <small>(admins only)</small> <input name="pin" type="password" autocomplete="off"></label>
  <button>Continue</button>
</form>
{% endblock %}
